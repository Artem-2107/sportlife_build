name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Enable Android builds
      run: flutter config --enable-android
      
    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses || true
      
    - name: Install dependencies
      working-directory: ./frontend
      run: |
        pip install -r requirements.txt
        pip install flet
        
    - name: Build APK
      # Запускаем в корне, чтобы flet прочитал pyproject.toml
      run: flet build apk
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SportLife-Flet-APK
        path: frontend/build/apk/*.apk